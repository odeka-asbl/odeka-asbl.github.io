<script>
(function () {
  function init() {
    var nav = document.querySelector('.navbar-nav');
    if (!nav) return;
    var activeLink = document.querySelector('.navbar-nav .nav-link.active');
    // On the homepage, none of the nav items are "active" (the homepage
    // itself is the logo, not a nav link) — there's no resting spot to
    // return to, so the brackets stay hidden until the cursor lands on
    // a title, then fade in there instead of sliding in from nowhere.

    // Quarto only marks a nav link .active on an exact URL match against
    // that section's own index page, so a News/Jobs/Projects POST page
    // (one level deeper, e.g. 04_news/posts/x.html) gets no active link
    // at all — even though the visitor is still within that section.
    // Fall back to matching the current page's top-level folder against
    // each nav link's target folder, so a post keeps its section
    // highlighted the same way the section's own index page is.
    if (!activeLink) {
      var pathSegments = location.pathname.split('/').filter(Boolean);
      var currentSection = pathSegments.length > 1 ? pathSegments[0] : null;
      if (currentSection) {
        nav.querySelectorAll('.nav-link').forEach(function (link) {
          var linkSegments = new URL(link.href).pathname.split('/').filter(Boolean);
          if (linkSegments[0] === currentSection) {
            activeLink = link;
          }
        });
      }
    }

    var container = document.querySelector('.navbar-collapse') || nav.parentElement;
    if (getComputedStyle(container).position === 'static') {
      container.style.position = 'relative';
    }

    var leftB = document.createElement('span');
    var rightB = document.createElement('span');
    leftB.className = 'nav-bracket nav-bracket-left';
    rightB.className = 'nav-bracket nav-bracket-right';
    container.appendChild(leftB);
    container.appendChild(rightB);

    var gap = 4;
    var currentLink = null;
    var trackingFrame = null;
    var navigating = false;
    var visible = false;

    function show() {
      if (!visible) {
        leftB.classList.add('nav-bracket-visible');
        rightB.classList.add('nav-bracket-visible');
        visible = true;
      }
    }

    function hide() {
      if (visible) {
        leftB.classList.remove('nav-bracket-visible');
        rightB.classList.remove('nav-bracket-visible');
        visible = false;
      }
      if (currentLink) {
        currentLink.classList.remove('nav-link-bracketed');
        currentLink = null;
      }
    }

    function updatePosition(link) {
      var lr = link.getBoundingClientRect();
      var cr = container.getBoundingClientRect();
      var top = lr.top - cr.top + lr.height / 2;
      leftB.style.top = top + 'px';
      rightB.style.top = top + 'px';
      leftB.style.left = (lr.left - cr.left - gap) + 'px';
      rightB.style.left = (lr.right - cr.left + gap) + 'px';
    }

    // Tracks the link's live position on every frame for the duration of
    // the margin/reflow transition (300ms — a bit longer than the 250ms
    // CSS transition, to be safe), instead of jumping to a single
    // precomputed target. That target would depend on exactly how far
    // the reflow had progressed at the moment we measured it, which
    // differs depending on hover direction and caused the brackets to
    // overshoot left or right of where they should land.
    function trackDuring(link, duration) {
      if (trackingFrame) cancelAnimationFrame(trackingFrame);
      var start = performance.now();
      function step(now) {
        updatePosition(link);
        if (now - start < duration) {
          trackingFrame = requestAnimationFrame(step);
        } else {
          trackingFrame = null;
        }
      }
      trackingFrame = requestAnimationFrame(step);
    }

    function place(link) {
      if (navigating) return;
      if (currentLink && currentLink !== link) {
        currentLink.classList.remove('nav-link-bracketed');
      }
      link.classList.add('nav-link-bracketed');
      currentLink = link;
      trackDuring(link, 300);
      show();
    }

    // Used only for the homepage's very first hover, where there's no
    // active link to have already made room. Rather than tracking the
    // link's live (still-animating) position and revealing mid-chase —
    // which looked like a small lateral drift once visible — this
    // measures the link's TRUE final position up front, synchronously
    // and invisibly (the standard FLIP trick: apply the class with
    // transitions off, measure, undo, then re-apply with transitions
    // back on so the real visible reflow still plays normally). The
    // bracket is placed at that exact resting spot from the start, so
    // when it fades in partway through the reflow, it never moves —
    // it just appears in place while the titles are still sliding.
    function placeDeferred(link) {
      if (navigating) return;
      if (currentLink && currentLink !== link) {
        currentLink.classList.remove('nav-link-bracketed');
      }

      link.style.transition = 'none';
      link.classList.add('nav-link-bracketed');
      updatePosition(link);
      link.classList.remove('nav-link-bracketed');
      void link.offsetWidth;
      link.style.transition = '';
      link.classList.add('nav-link-bracketed');

      currentLink = link;
      var target = link;
      setTimeout(function () {
        if (currentLink === target) show();
      }, 90);
    }

    if (activeLink) {
      place(activeLink);
      // Only turn on the margin transition after the very first placement
      // has already painted — otherwise that first placement animates in
      // from 0 instead of appearing instantly in its resting spot.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.documentElement.classList.add('nav-brackets-ready');
        });
      });

      // On a fresh page load (i.e. right after clicking a nav link), the
      // navbar can still shift slightly after our initial 300ms tracking
      // window closes — most commonly because the custom font hasn't
      // finished swapping in yet, or a scrollbar appearing/disappearing
      // as images finish loading. Silently re-measure once things have
      // settled, using updatePosition() directly rather than place() —
      // place() re-triggers the full animated placement (class toggle +
      // 300ms tracking + show), which is right for an actual hover move
      // but caused a visible "shiver" here, since nothing was actually
      // moving on purpose, just correcting a couple of stray pixels.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          if (currentLink === activeLink) updatePosition(activeLink);
        });
      }
      window.addEventListener('load', function () {
        if (currentLink === activeLink) updatePosition(activeLink);
      });
    } else {
      // Homepage: nothing to place yet, but transitions can turn on
      // immediately since the first appearance is supposed to fade in.
      document.documentElement.classList.add('nav-brackets-ready');
    }

    var links = nav.querySelectorAll('.nav-link');
    links.forEach(function (link) {
      link.addEventListener('mouseenter', function () {
        if (!activeLink && !visible) {
          placeDeferred(link);
        } else {
          place(link);
        }
      });
      // The instant a nav link is clicked, the page is about to unload.
      // Some browsers fire a mouseleave on the nav as part of that
      // process, which would otherwise snap the brackets back to the
      // old active link for a couple of frames — a visible "shiver" —
      // right before the new page replaces everything anyway. Stop
      // reacting to any further hover events once a click has happened.
      link.addEventListener('click', function () {
        navigating = true;
        if (trackingFrame) {
          cancelAnimationFrame(trackingFrame);
          trackingFrame = null;
        }
      });
    });

    nav.addEventListener('mouseleave', function () {
      if (activeLink) {
        place(activeLink);
      } else {
        hide();
      }
    });

    window.addEventListener('resize', function () {
      // Silent correction, same reasoning as the load/fonts.ready
      // handlers above — a scrollbar appearing as a freshly-loaded
      // page's images finish loading can fire this, and it should
      // never trigger the full animated replay.
      if (activeLink && currentLink === activeLink) updatePosition(activeLink);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script>
(function () {
  // Full-bleed banner/title correction. .hero-image and the overlaid
  // .quarto-title-block break out to full viewport width via
  // left:50% + transform:translateX(-50%) — a trick that only
  // self-centers correctly when its containing block (main.content)
  // is itself horizontally centered on the viewport. That holds on
  // every page with toc:false, but a page with a TOC sidebar pushes
  // main.content off-center (extra reserved space on the right for
  // the sidebar), and the two 50%s stop canceling out — the banner
  // ends up shifted left by exactly that off-centering. Fixed here by
  // measuring main.content's actual live offset and setting `left`
  // to the exact pixel value that re-centers on the true viewport,
  // instead of assuming the parent is centered.
  function correctFullBleed() {
    var targets = document.querySelectorAll(
      '.full-width-banner .hero-image, main.content:has(.full-width-banner) .quarto-title-block, ' +
      '.page-footer-copyright, .page-footer-logo, .page-footer-social, ' +
      'hr.about-sep:has(+ .page-footer-social)'
    );
    if (!targets.length) return;
    var main = document.querySelector('main.content');
    if (!main) return;
    var mainLeft = main.getBoundingClientRect().left;
    var leftPx = (window.innerWidth / 2 - mainLeft) + 'px';
    targets.forEach(function (el) {
      el.style.setProperty('left', leftPx, 'important');
    });
  }

  correctFullBleed();
  window.addEventListener('load', correctFullBleed);
  window.addEventListener('resize', correctFullBleed);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(correctFullBleed);
  }
})();
</script>

<script>
(function () {
  // The TOC sidebar (#quarto-margin-sidebar) is position:sticky, and
  // its containing block is the whole page-columns row — which spans
  // all the way down through the closing banner and footer, not just
  // the article content. Native sticky has nothing else telling it to
  // let go, so on a long page it stays stuck and visibly overlaps the
  // closing banner as you scroll past it.
  //
  // Fixed by capturing exactly where the sidebar is sitting on screen
  // the moment continuing to stick would start overlapping the
  // banner, and pinning it there via position:fixed (both top and
  // left — fixed removes it from the grid entirely, so its column
  // placement has to be captured explicitly too, or it collapses
  // toward the viewport's top-left corner). Unlike position:absolute
  // (anchored to a document position, so it still scrolls away with
  // the page), fixed keeps it on screen at that same spot for the
  // rest of the scroll — it stops, but never disappears. Reverses if
  // scrolled back above the point where it froze.
  function correctSidebarOverlap() {
    var sidebar = document.querySelector('#quarto-margin-sidebar');
    if (!sidebar) return;
    var banners = document.querySelectorAll('main.content .full-width-banner .hero-image');
    var closingBanner = banners.length ? banners[banners.length - 1] : null;
    if (!closingBanner) return;
    // The sidebar's own box has max-height:100vh (Quarto's default) and
    // is stretched to fill most of the viewport, not sized to its
    // actual content — using its height/bottom directly would trigger
    // way too early. The TOC nav inside it is sized to its real
    // content, so that's what matters here.
    var content = sidebar.querySelector('nav#TOC') || sidebar;
    var gap = 24;

    // The sidebar's natural "stuck" resting position (top/left) and the
    // TOC's real height are measured once, here, rather than read live
    // on every scroll. Reading them live seemed more accurate, but on
    // one large scroll jump (a trackpad flick straight to the bottom,
    // dragging the scrollbar thumb, pressing End) the only scroll event
    // that fires can land AFTER native sticky has already run out of
    // its own containing block and detached down near the footer — at
    // that instant getBoundingClientRect() reports the already-detached
    // position, and freezing from it just pins the sidebar exactly
    // where it had already gone wrong. Measuring once, up front, while
    // nothing has scrolled yet and stickiness is unambiguously engaged
    // at its true resting offset, avoids ever sampling that broken
    // in-between state.
    if (sidebar.dataset.stuckTop === undefined) {
      var r = sidebar.getBoundingClientRect();
      var cr = content.getBoundingClientRect();
      sidebar.dataset.stuckTop = r.top;
      sidebar.dataset.stuckLeft = r.left;
      sidebar.dataset.contentHeight = cr.height;
    }

    var stuckTop = parseFloat(sidebar.dataset.stuckTop);
    var stuckLeft = parseFloat(sidebar.dataset.stuckLeft);
    var contentHeight = parseFloat(sidebar.dataset.contentHeight);

    // Everything from here on is pure scrollY arithmetic against a
    // reliable, non-sticky element (the banner) — no live read of the
    // sidebar's own current position — so it gives the same answer
    // whether this fires many times during a slow scroll or exactly
    // once after a huge jump.
    var bannerRect = closingBanner.getBoundingClientRect();
    var bannerDocTop = bannerRect.top + window.scrollY;
    var freezeScrollY = bannerDocTop - stuckTop - contentHeight - gap;
    var shouldFreeze = window.scrollY >= freezeScrollY;

    if (shouldFreeze && !sidebar.dataset.frozen) {
      // Quarto's own CSS puts a `transition: top 200ms linear` on
      // .sidebar. Switching position from sticky to fixed changes what
      // the `top` property even means, so without suppressing the
      // transition for this one switch, the browser eases into the new
      // spot instead of snapping, causing a brief visible drift.
      sidebar.style.setProperty('transition', 'none', 'important');
      sidebar.style.setProperty('position', 'fixed', 'important');
      sidebar.style.setProperty('top', stuckTop + 'px', 'important');
      sidebar.style.setProperty('left', stuckLeft + 'px', 'important');
      sidebar.style.setProperty('margin', '0', 'important');
      // The fade below (opacity ramping down as soon as it stops) is
      // brief, but the banner — later in the DOM — would still paint
      // over the sidebar during that window without an explicit
      // stacking order, since both occupy the same screen area then.
      sidebar.style.setProperty('z-index', '50', 'important');
      sidebar.dataset.frozen = '1';
      void sidebar.offsetHeight;
      sidebar.style.removeProperty('transition');
    } else if (!shouldFreeze && sidebar.dataset.frozen) {
      sidebar.style.setProperty('transition', 'none', 'important');
      sidebar.style.removeProperty('position');
      sidebar.style.removeProperty('top');
      sidebar.style.removeProperty('left');
      sidebar.style.removeProperty('margin');
      sidebar.style.removeProperty('z-index');
      delete sidebar.dataset.frozen;
      void sidebar.offsetHeight;
      sidebar.style.removeProperty('transition');
    }

    // Pinning the sidebar to a constant screen position doesn't stop the
    // banner below it from scrolling — the banner is tall and keeps
    // sliding up the screen with further scrolling, so staying frozen
    // for the rest of the page would eventually put the banner right
    // where the sidebar sits. Opacity is tied directly to scroll
    // position, continuously, starting well before it actually stops
    // (PREFADE_DISTANCE, while it's still tracking scroll normally) and
    // finishing a bit after (FADE_DISTANCE) — no separate "hidden"
    // state or CSS transition to desync from the actual scroll, and no
    // abrupt jump from fully-opaque to fading. Scrolling back up
    // reverses it exactly the same way, continuously.
    var PREFADE_DISTANCE = 450;
    var FADE_DISTANCE = 20;
    var fadeStart = freezeScrollY - PREFADE_DISTANCE;
    var fadeProgress = (window.scrollY - fadeStart) / (PREFADE_DISTANCE + FADE_DISTANCE);
    var opacity = Math.max(0, Math.min(1, 1 - fadeProgress));
    if (opacity < 1) {
      sidebar.style.setProperty('opacity', String(opacity), 'important');
      sidebar.style.setProperty('pointer-events', opacity > 0 ? 'auto' : 'none', 'important');
    } else {
      sidebar.style.removeProperty('opacity');
      sidebar.style.removeProperty('pointer-events');
    }
  }

  // Re-measures the sidebar's natural resting position. Only safe to
  // call while not frozen — while frozen, the sidebar is pinned via
  // inline styles, so reading its rect would capture that pinned
  // position instead of the true sticky resting spot.
  function remeasureSidebarStuckPosition() {
    var sidebar = document.querySelector('#quarto-margin-sidebar');
    if (!sidebar || sidebar.dataset.frozen) return;
    delete sidebar.dataset.stuckTop;
    correctSidebarOverlap();
  }

  window.addEventListener('scroll', correctSidebarOverlap, { passive: true });
  window.addEventListener('resize', function () {
    remeasureSidebarStuckPosition();
    correctSidebarOverlap();
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      remeasureSidebarStuckPosition();
      correctSidebarOverlap();
    });
  }
  correctSidebarOverlap();
})();
</script>
