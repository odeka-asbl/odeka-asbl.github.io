project:
  type: website
  output-dir: docs
  render:
    - "*"
    # CLAUDE.md is project/AI-assistant notes, not a page — Quarto has a
    # built-in exception for README.md but not other root .md files, so
    # without this it silently gets published as a live page. If another
    # root-level .md file is ever added that isn't meant to be a page,
    # exclude it here too.
    - "!CLAUDE.md"
    # =====================================================================
    # NEWS SECTION SWITCH — see read_me/ for the full instructions.
    # To turn the News section OFF, uncomment the line below (and see
    # the matching comments in the navbar just below and in index.qmd —
    # all three need to change together), then run `quarto render`. That
    # single render both removes 04_news from the live site (already-built
    # pages get pruned automatically, nothing to delete by hand) and picks
    # up the other two changes. To turn News back ON, reverse all three;
    # nothing in 04_news/ itself is ever touched, so it comes back exactly
    # as it was.
    # - "!04_news/**"
    # =====================================================================

website:
  site-url: "https://odeka-asbl.github.io"
  title: "<img src='/odeka_logo.png' style='height: 30px; vertical-align: middle; margin-right: 8px;'><span style='color: black;vertical-align: middle;'>ODEKA</span>"
  favicon: "/favicon.ico"
  navbar:
    left:
      - href: 01_about/about.qmd
        text: About us
      - href: 02_people/people.qmd
        text: People
      - href: 03_projects/index.qmd
        text: Projects
      # NEWS SWITCH: comment out these two lines to remove News from the navbar
      - href: 04_news/index.qmd
        text: News
      - href: 05_jobs/index.qmd
        text: Jobs
      - href: 06_contacts/contacts.qmd
        text: Contacts
      - href: 07_legal_notice/legal_notice.qmd
        text: Legal Notice 

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    include-after-body: nav-brackets-include.html
    # No page on this site uses math notation, so Quarto's default MathJax
    # setup (html-math-method: mathjax) is pure dead weight — worse, it
    # pulls in a render-blocking <script src="https://polyfill.io/..."> as
    # a dependency. polyfill.io was sold to a new owner in 2024 and began
    # serving malware through that exact script; browsers and security
    # software widely started blocking/throttling it since, which can
    # visibly stall page load (Safari especially) while the browser waits
    # on that connection. Disabling math rendering removes both scripts.
    html-math-method: plain

editor:
  render-on-save: true
